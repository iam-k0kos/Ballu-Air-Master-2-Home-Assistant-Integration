# Ballu Air Master 2 BMAC-300 — локальное управление через ESPHome
#
# ПРОТОКОЛ (UART 9600 8N1):
#   кадр: AA | LEN | LEN байт данных | сумма всех предыдущих байт (mod 256)
#   плата -> модуль: AA 13 {09|8A|88} ... (22 байта) — состояние:
#     [3] флаги: 0x01 питание, 0x20 ионизатор, 0x40 УФ-лампа
#     [5] температура 5..25, [18] скорость 1..5
#   модуль -> плата: AA 12 0A ... (21 байт) — команда:
#     [3] флаги, [5] температура, [17] скорость, [6..14] копия состояния
#
# ПОДКЛЮЧЕНИЕ (родной Wi-Fi модуль отключить):
#   "RX" разъёма (плата шлёт данные) -> GPIO3
#       4–5 В на пине: делитель 4,7 кОм + 10 кОм на GND; 3,3 В: напрямую или через 1 кОм
#   "TX" разъёма (команды на плату) <- GPIO4 через 330–470 Ом
#   GND -> GND, +5V -> 5V ESP

esphome:
  name: ballu-breezer
  on_boot:
    priority: -100
    then:
      # стартовая последовательность родного модуля
      - delay: 3s
      - uart.write: [0xAA, 0x02, 0x03, 0x02, 0xCC]        # Wi-Fi: подключение
      - delay: 2700ms
      - uart.write: [0xAA, 0x02, 0x03, 0x03, 0xCC]        # Wi-Fi: подключено
      - delay: 1600ms
      - uart.write: [0xAA, 0x03, 0x08, 0x10, 0x04, 0xC9]  # запрос состояния
      - uart.write: [0xAA, 0x01, 0x07, 0xB2]
      - delay: 3s
      - uart.write: [0xAA, 0x01, 0x01, 0xAC]

esp32:
  board: esp32-c3-devkitm-1     # классический ESP32: esp32dev, UART на GPIO17/16
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret ballu_breezer__encryption_key

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 15dB             # при обрывах связи — 11dB или 8.5dB

uart:
  id: bz
  tx_pin: GPIO4
  rx_pin: GPIO3
  baud_rate: 9600

globals:
  - id: rxbuf
    type: std::vector<uint8_t>
  - id: last_rx_ms
    type: uint32_t
    initial_value: '0'
  - id: have_state
    type: bool
    initial_value: 'false'
  - id: raw
    type: std::vector<uint8_t>     # последний кадр состояния (22 байта)
  - id: s_flags
    type: uint8_t
    initial_value: '0'
  - id: s_temp
    type: uint8_t
    initial_value: '10'
  - id: s_speed
    type: uint8_t
    initial_value: '3'
  # ожидающая команда: pm_mask — какие биты флагов менять, pm_val — их значения
  - id: pend
    type: bool
    initial_value: 'false'
  - id: pm_mask
    type: uint8_t
    initial_value: '0'
  - id: pm_val
    type: uint8_t
    initial_value: '0'
  - id: p_set_temp
    type: bool
    initial_value: 'false'
  - id: p_temp
    type: uint8_t
    initial_value: '10'
  - id: p_set_speed
    type: bool
    initial_value: 'false'
  - id: p_speed
    type: uint8_t
    initial_value: '3'
  - id: p_tries
    type: uint8_t
    initial_value: '0'

# Команды не шлются сразу, а ставятся в очередь: кадр собирается при отправке
# из свежего состояния платы, поэтому быстрые нажатия не затирают друг друга.
script:
  - id: queue_flag
    mode: queued
    parameters:
      mask: int
      val: bool
    then:
      - lambda: |-
          uint8_t m = (uint8_t) mask;
          id(pm_mask) = id(pm_mask) | m;
          if (val) id(pm_val) = id(pm_val) | m;
          else     id(pm_val) = id(pm_val) & (uint8_t) (~m);
          id(p_tries) = 0; id(pend) = true;
  - id: queue_temp
    mode: queued
    parameters:
      t: int
    then:
      - lambda: |-
          id(p_temp) = (uint8_t) t; id(p_set_temp) = true;
          id(p_tries) = 0; id(pend) = true;
  - id: queue_speed
    mode: queued
    parameters:
      s: int
    then:
      - lambda: |-
          id(p_speed) = (uint8_t) s; id(p_set_speed) = true;
          id(p_tries) = 0; id(pend) = true;

interval:
  # ---- приём и разбор кадров по структуре (AA | LEN | данные | сумма) ----
  - interval: 20ms
    then:
      - lambda: |-
          auto &buf = id(rxbuf);
          uint32_t now = millis();
          // неполный кадр после 200 мс тишины — выбросить
          if (!buf.empty() && (now - id(last_rx_ms)) > 200) buf.clear();
          uint8_t b;
          while (id(bz).available() && id(bz).read_byte(&b)) {
            id(last_rx_ms) = now;
            buf.push_back(b);
            while (!buf.empty()) {
              if (buf[0] != 0xAA) { buf.erase(buf.begin()); continue; }
              if (buf.size() < 3) break;
              // короткий кадр платы AA 02 05 xx (4 байта, без суммы) — пропустить
              if (buf[1] == 0x02 && buf[2] == 0x05) {
                if (buf.size() < 4) break;
                buf.erase(buf.begin(), buf.begin() + 4);
                continue;
              }
              size_t need = (size_t) buf[1] + 3;
              if (need > 40) { buf.erase(buf.begin()); continue; }
              if (buf.size() < need) break;
              uint8_t sum = 0;
              for (size_t i = 0; i + 1 < need; i++) sum += buf[i];
              if (sum != buf[need - 1]) {
                buf.erase(buf.begin());
                continue;
              }
              if (need == 22 && buf[1] == 0x13 &&
                  (buf[2] == 0x09 || buf[2] == 0x8A || buf[2] == 0x88)) {
                uint8_t fl = buf[3], tp = buf[5], sp = buf[18];
                bool changed = !id(have_state) || fl != id(s_flags) || tp != id(s_temp) || sp != id(s_speed);
                id(raw) = std::vector<uint8_t>(buf.begin(), buf.begin() + need);
                id(s_flags) = fl; id(s_temp) = tp; id(s_speed) = sp;
                id(have_state) = true;
                // температура входящего воздуха — байт [19], со знаком
                {
                  float air = (float) (int8_t) buf[19];
                  if (!id(air_temp).has_state() || id(air_temp).state != air) id(air_temp).publish_state(air);
                }
                // в HA публикуем только изменения
                if (changed) {
                  ESP_LOGI("ballu", "состояние: питание=%d ионизатор=%d УФ=%d темп=%u скорость=%u",
                           (int) ((fl & 0x01) != 0), (int) ((fl & 0x20) != 0), (int) ((fl & 0x40) != 0), (unsigned) tp, (unsigned) sp);
                  id(sw_power).publish_state(fl & 0x01);
                  id(sw_ion).publish_state(fl & 0x20);
                  id(sw_uv).publish_state(fl & 0x40);
                  id(num_temp).publish_state(tp);
                  id(num_speed).publish_state(sp);
                }
              }
              buf.erase(buf.begin(), buf.begin() + need);
            }
          }

  # ---- отправка команды: повтор каждые 500 мс до подтверждения, максимум 6 раз ----
  - interval: 500ms
    then:
      - lambda: |-
          if (!id(pend) || !id(have_state)) return;
          uint8_t flags = (id(s_flags) & (uint8_t) (~id(pm_mask))) | (id(pm_val) & id(pm_mask));
          uint8_t temp  = id(p_set_temp)  ? id(p_temp)  : id(s_temp);
          uint8_t speed = id(p_set_speed) ? id(p_speed) : id(s_speed);
          bool done = (flags == id(s_flags) && temp == id(s_temp) && speed == id(s_speed));
          if (done || id(p_tries) >= 6) {
            if (!done) ESP_LOGW("ballu", "команда не подтверждена: хотим флаги=0x%02X темп=%u скорость=%u, у платы флаги=0x%02X темп=%u скорость=%u",
                                (unsigned) flags, (unsigned) temp, (unsigned) speed, (unsigned) id(s_flags), (unsigned) id(s_temp), (unsigned) id(s_speed));
            id(pend) = false; id(pm_mask) = 0; id(pm_val) = 0;
            id(p_set_temp) = false; id(p_set_speed) = false;
            return;
          }
          auto &r = id(raw);
          uint8_t f[21];
          f[0] = 0xAA; f[1] = 0x12; f[2] = 0x0A;
          f[3] = flags;
          f[4] = r[4];
          f[5] = temp;
          for (int i = 6; i <= 14; i++) f[i] = r[i];
          f[15] = 0x00; f[16] = 0x00;
          f[17] = speed;
          f[18] = 0x00; f[19] = 0x00;
          uint8_t sum = 0;
          for (int i = 0; i < 20; i++) sum += f[i];
          f[20] = sum;
          id(bz).write_array(f, 21);
          id(p_tries)++;

  # heartbeat «Wi-Fi подключён», как у родного модуля
  - interval: 5s
    then:
      - uart.write: [0xAA, 0x03, 0x06, 0x03, 0xCC]

  # опрос состояния (изменения плата присылает сама)
  - interval: 15s
    then:
      - uart.write: [0xAA, 0x03, 0x08, 0x10, 0x04, 0xC9]

# ---- датчики ----
sensor:
  # значение берётся из кадра состояния (см. разбор выше), своего опроса нет
  - platform: template
    id: air_temp
    name: "Температура входящего воздуха"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: wifi_signal
    id: wifi_dbm
    name: "Бризер Wi-Fi сигнал"
    update_interval: 30s
    entity_category: diagnostic
  - platform: copy
    source_id: wifi_dbm
    name: "Бризер Wi-Fi качество"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - lambda: return std::min(100.0f, std::max(0.0f, 2.0f * (x + 100.0f)));
  - platform: internal_temperature
    name: "Бризер температура чипа"   # норма до 60–65 °C
    update_interval: 60s
    entity_category: diagnostic

# ---- управление ----
# restore_mode: DISABLED — после перезагрузки ESP не повторяет старые действия
switch:
  - platform: template
    id: sw_power
    name: "Бризер питание"
    optimistic: false
    restore_mode: DISABLED
    turn_on_action:
      - script.execute: { id: queue_flag, mask: 1, val: true }
    turn_off_action:
      - script.execute: { id: queue_flag, mask: 1, val: false }

  - platform: template
    id: sw_ion
    name: "Бризер ионизатор"
    optimistic: false
    restore_mode: DISABLED
    turn_on_action:
      - script.execute: { id: queue_flag, mask: 32, val: true }
    turn_off_action:
      - script.execute: { id: queue_flag, mask: 32, val: false }

  - platform: template
    id: sw_uv
    name: "Бризер УФ-лампа"
    optimistic: false
    restore_mode: DISABLED
    turn_on_action:
      - script.execute: { id: queue_flag, mask: 64, val: true }
    turn_off_action:
      - script.execute: { id: queue_flag, mask: 64, val: false }

number:
  - platform: template
    id: num_temp
    name: "Бризер температура"
    min_value: 5
    max_value: 25
    step: 1
    mode: box
    unit_of_measurement: "°C"
    optimistic: false
    set_action:
      - script.execute:
          id: queue_temp
          t: !lambda 'return (int) x;'

  - platform: template
    id: num_speed
    name: "Бризер скорость"
    min_value: 1
    max_value: 5
    step: 1
    mode: box
    optimistic: false
    set_action:
      - script.execute:
          id: queue_speed
          s: !lambda 'return (int) x;'
