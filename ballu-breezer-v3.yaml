# Ballu Air Master 2 BMAC-300 — локальное управление через ESPHome (v2)
#
# ПРОТОКОЛ (UART 9600 8N1), восстановлен по захватам логическим анализатором:
#   кадр:  AA | LEN | LEN байт данных | сумма всех предыдущих байт (mod 256)
#   плата -> модуль: AA 13 {09|8A|88} ... (22 байта) — состояние:
#       [3] флаги: 0x01 питание, 0x20 ионизатор, 0x40 УФ-лампа
#       [5] заданная температура 5..25,  [18] скорость 1..5
#   модуль -> плата: AA 12 0A ... (21 байт) — команда, повторяется каждые 0,5 с до ответа:
#       [3] флаги, [5] температура, [17] скорость, [6..14] копия состояния
#
# ПОДКЛЮЧЕНИЕ (родной модуль ОТКЛЮЧИТЬ):
#   пин разъёма "RX" (плата шлёт данные) -> GPIO3. Если на пине 4–5 В: делитель 4,7 кОм + 10 кОм на GND;
#     если там 3,3 В: БЕЗ делителя, напрямую (или через 1 кОм)
#   пин разъёма "TX" (модуль слал команды) <- GPIO4 через 330–470 Ом
#   GND к GND, +5V к 5V ESP.
#
# ЧТО ИЗМЕНЕНО В v3 (по новому захвату родного модуля):
#  * диапазон температуры 5..25 °C (в захвате плата принимает 0x05..0x19);
#  * разбор кадров по структуре (AA, длина, сумма) без привязки ко времени: раньше при
#    задержке цикла из-за логов буфер сбрасывался посреди кадра, и состояние терялось;
#  * в HA состояние публикуется только при изменении (раньше числа слались ~200 раз/с —
#    это перегружало Wi-Fi/API и давало задержки и неверный статус ионизатора/УФ);
#  * отладочный лог всех байтов убран, уровень логов INFO; пишутся только команды и изменения;
#  * keep-alive как у родного модуля: heartbeat «подключено» (AA 03 06 03 CC) раз в 5 с,
#    опрос состояния раз в 15 с (остальное плата присылает сама при изменениях);
#  * мощность Wi-Fi 15 дБ; убраны IP/SSID/BSSID, оставлен уровень сигнала.
#
# ИЗМЕНЕНИЯ v2:
#  * команда собирается в момент ОТПРАВКИ из самого свежего состояния платы, а не в момент
#    нажатия: быстрые нажатия (УФ + ионизатор) не затирают друг друга;
#  * переключатели не восстанавливают старое состояние при загрузке (раньше ESPHome мог
#    после перезагрузки выполнить сохранённые действия — отсюда «лишние» включения);
#  * в лог пишется каждая отправляемая команда (флаги/темп./скорость) и текущее состояние;
#  * Wi-Fi: максимальная мощность, без энергосбережения, датчик уровня сигнала в HA.

esphome:
  name: ballu-breezer
  on_boot:
    priority: -100
    then:
      # последовательность, которую родной модуль шлёт после включения (по захвату)
      - delay: 3s
      - uart.write: [0xAA, 0x02, 0x03, 0x02, 0xCC]        # Wi-Fi: подключение
      - delay: 2700ms
      - uart.write: [0xAA, 0x02, 0x03, 0x03, 0xCC]        # Wi-Fi: подключено
      - delay: 1600ms
      - uart.write: [0xAA, 0x03, 0x08, 0x10, 0x04, 0xC9]  # запрос состояния
      - uart.write: [0xAA, 0x01, 0x07, 0xB2]
      - delay: 3s
      - uart.write: [0xAA, 0x01, 0x01, 0xAC]

esp32:
  board: esp32-c3-devkitm-1     # для классического ESP32: board: esp32dev, пины UART ниже 17/16
  framework:
    type: esp-idf

logger:
  level: INFO

api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none          # без энергосбережения: стабильнее связь и ниже задержка
  output_power: 15dB             # если не подключается/отваливается — 11dB или 8.5dB

uart:
  id: bz
  tx_pin: GPIO4                  # классический ESP32: GPIO17
  rx_pin: GPIO3                  # классический ESP32: GPIO16
  baud_rate: 9600

globals:
  - id: rx_bytes
    type: uint32_t
    initial_value: '0'
  - id: rx_good
    type: uint32_t
    initial_value: '0'
  - id: rx_bad
    type: uint32_t
    initial_value: '0'
  - id: rxbuf
    type: std::vector<uint8_t>
  - id: last_rx_ms
    type: uint32_t
    initial_value: '0'
  - id: have_state
    type: bool
    initial_value: 'false'
  - id: raw
    type: std::vector<uint8_t>     # последний валидный кадр состояния (22 байта)
  # состояние платы
  - id: s_flags
    type: uint8_t
    initial_value: '0'
  - id: s_temp
    type: uint8_t
    initial_value: '10'
  - id: s_speed
    type: uint8_t
    initial_value: '3'
  # ожидающее изменение: какие биты флагов менять (pm_mask) и их нужные значения (pm_val)
  - id: pend
    type: bool
    initial_value: 'false'
  - id: pm_mask
    type: uint8_t
    initial_value: '0'
  - id: pm_val
    type: uint8_t
    initial_value: '0'
  - id: p_set_temp
    type: bool
    initial_value: 'false'
  - id: p_temp
    type: uint8_t
    initial_value: '10'
  - id: p_set_speed
    type: bool
    initial_value: 'false'
  - id: p_speed
    type: uint8_t
    initial_value: '3'
  - id: p_tries
    type: uint8_t
    initial_value: '0'

script:
  # изменить один бит флагов (питание/ионизатор/УФ)
  - id: queue_flag
    mode: queued
    parameters:
      mask: int
      val: bool
    then:
      - lambda: |-
          uint8_t m = (uint8_t) mask;
          id(pm_mask) = id(pm_mask) | m;
          if (val) id(pm_val) = id(pm_val) | m;
          else     id(pm_val) = id(pm_val) & (uint8_t) (~m);
          id(p_tries) = 0; id(pend) = true;
  - id: queue_temp
    mode: queued
    parameters:
      t: int
    then:
      - lambda: |-
          id(p_temp) = (uint8_t) t; id(p_set_temp) = true;
          id(p_tries) = 0; id(pend) = true;
  - id: queue_speed
    mode: queued
    parameters:
      s: int
    then:
      - lambda: |-
          id(p_speed) = (uint8_t) s; id(p_set_speed) = true;
          id(p_tries) = 0; id(pend) = true;

interval:
  # ---- приём и разбор кадров (по структуре: AA | LEN | данные | сумма) ----
  - interval: 20ms
    then:
      - lambda: |-
          auto &buf = id(rxbuf);
          uint32_t now = millis();
          // «зависший» хвост неполного кадра (> 200 мс тишины) — выбросить
          if (!buf.empty() && (now - id(last_rx_ms)) > 200) buf.clear();
          uint8_t b;
          while (id(bz).available() && id(bz).read_byte(&b)) {
            id(last_rx_ms) = now;
            id(rx_bytes)++;
            buf.push_back(b);
            // обработать всё, что можно разобрать
            while (!buf.empty()) {
              if (buf[0] != 0xAA) { buf.erase(buf.begin()); continue; }
              if (buf.size() < 3) break;
              // особый короткий кадр платы AA 02 05 xx (4 байта, без суммы) — пропустить
              if (buf[1] == 0x02 && buf[2] == 0x05) {
                if (buf.size() < 4) break;
                buf.erase(buf.begin(), buf.begin() + 4);
                continue;
              }
              size_t need = (size_t) buf[1] + 3;
              if (need > 40) { buf.erase(buf.begin()); continue; }   // не похоже на кадр
              if (buf.size() < need) break;                          // ждём остаток
              uint8_t sum = 0;
              for (size_t i = 0; i + 1 < need; i++) sum += buf[i];
              if (sum != buf[need - 1]) {
                // «CC»-кадры (heartbeat/статус) сумме не подчиняются — это нормально
                if (buf[need - 1] != 0xCC) id(rx_bad)++;
                buf.erase(buf.begin());                              // сдвиг на 1 байт, поиск следующего AA
                continue;
              }
              if (need == 22 && buf[1] == 0x13 &&
                  (buf[2] == 0x09 || buf[2] == 0x8A || buf[2] == 0x88)) {
                uint8_t fl = buf[3], tp = buf[5], sp = buf[18];
                bool changed = !id(have_state) || fl != id(s_flags) || tp != id(s_temp) || sp != id(s_speed);
                id(raw) = std::vector<uint8_t>(buf.begin(), buf.begin() + need);
                id(s_flags) = fl; id(s_temp) = tp; id(s_speed) = sp;
                id(have_state) = true;
                id(rx_good)++;
                if (changed) {
                  ESP_LOGI("ballu", "состояние: питание=%d ионизатор=%d УФ=%d темп=%u скорость=%u",
                           (int) ((fl & 0x01) != 0), (int) ((fl & 0x20) != 0), (int) ((fl & 0x40) != 0), (unsigned) tp, (unsigned) sp);
                  id(sw_power).publish_state(fl & 0x01);
                  id(sw_ion).publish_state(fl & 0x20);
                  id(sw_uv).publish_state(fl & 0x40);
                  id(num_temp).publish_state(tp);
                  id(num_speed).publish_state(sp);
                }
              }
              buf.erase(buf.begin(), buf.begin() + need);
            }
          }

  # ---- отправка команды: повтор каждые 500 мс (как родной модуль), максимум 6 раз ----
  - interval: 500ms
    then:
      - lambda: |-
          if (!id(pend) || !id(have_state)) return;
          uint8_t flags = (id(s_flags) & (uint8_t) (~id(pm_mask))) | (id(pm_val) & id(pm_mask));
          uint8_t temp  = id(p_set_temp)  ? id(p_temp)  : id(s_temp);
          uint8_t speed = id(p_set_speed) ? id(p_speed) : id(s_speed);
          bool done = (flags == id(s_flags) && temp == id(s_temp) && speed == id(s_speed));
          if (done || id(p_tries) >= 6) {
            if (!done) ESP_LOGW("ballu", "команда не подтверждена платой: хотим флаги=0x%02X темп=%u скорость=%u, у платы флаги=0x%02X темп=%u скорость=%u",
                                (unsigned) flags, (unsigned) temp, (unsigned) speed, (unsigned) id(s_flags), (unsigned) id(s_temp), (unsigned) id(s_speed));
            id(pend) = false; id(pm_mask) = 0; id(pm_val) = 0;
            id(p_set_temp) = false; id(p_set_speed) = false;
            return;
          }
          auto &r = id(raw);
          uint8_t f[21];
          f[0] = 0xAA; f[1] = 0x12; f[2] = 0x0A;
          f[3] = flags;
          f[4] = r[4];
          f[5] = temp;
          for (int i = 6; i <= 14; i++) f[i] = r[i];
          f[15] = 0x00; f[16] = 0x00;
          f[17] = speed;
          f[18] = 0x00; f[19] = 0x00;
          uint8_t sum = 0;
          for (int i = 0; i < 20; i++) sum += f[i];
          f[20] = sum;
          ESP_LOGI("ballu", "КОМАНДА #%u: флаги=0x%02X темп=%u скорость=%u (состояние платы: флаги=0x%02X темп=%u скорость=%u)",
                   (unsigned) id(p_tries) + 1, (unsigned) flags, (unsigned) temp, (unsigned) speed,
                   (unsigned) id(s_flags), (unsigned) id(s_temp), (unsigned) id(s_speed));
          id(bz).write_array(f, 21);
          id(p_tries)++;

  # ДИАГНОСТИКА: раз в минуту счётчики приёма
  - interval: 60s
    then:
      - lambda: |-
          ESP_LOGI("ballu", "RX bytes=%u good_state_frames=%u bad_checksum=%u have_state=%d",
                   (unsigned) id(rx_bytes), (unsigned) id(rx_good), (unsigned) id(rx_bad),
                   (int) id(have_state));

  # KEEP-ALIVE как у родного модуля: heartbeat «подключено» раз в 5 с
  - interval: 5s
    then:
      - uart.write: [0xAA, 0x03, 0x06, 0x03, 0xCC]

  # Опрос состояния раз в 15 с (изменения плата присылает сама кадром AA 13 09 ...)
  - interval: 15s
    then:
      - uart.write: [0xAA, 0x03, 0x08, 0x10, 0x04, 0xC9]

# ---- Wi-Fi: уровень сигнала в Home Assistant ----
sensor:
  - platform: wifi_signal
    id: wifi_dbm
    name: "Бризер Wi-Fi сигнал"
    update_interval: 30s
    entity_category: diagnostic
  - platform: copy
    source_id: wifi_dbm
    name: "Бризер Wi-Fi качество"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - lambda: return std::min(100.0f, std::max(0.0f, 2.0f * (x + 100.0f)));
  - platform: uptime
    name: "Бризер время работы"
    entity_category: diagnostic

# ---- сущности Home Assistant ----
switch:
  - platform: template
    id: sw_power
    name: "Бризер питание"
    optimistic: false
    restore_mode: DISABLED
    turn_on_action:
      - script.execute:
          id: queue_flag
          mask: 1
          val: true
    turn_off_action:
      - script.execute:
          id: queue_flag
          mask: 1
          val: false

  - platform: template
    id: sw_ion
    name: "Бризер ионизатор"
    optimistic: false
    restore_mode: DISABLED
    turn_on_action:
      - script.execute:
          id: queue_flag
          mask: 32
          val: true
    turn_off_action:
      - script.execute:
          id: queue_flag
          mask: 32
          val: false

  - platform: template
    id: sw_uv
    name: "Бризер УФ-лампа"
    optimistic: false
    restore_mode: DISABLED
    turn_on_action:
      - script.execute:
          id: queue_flag
          mask: 64
          val: true
    turn_off_action:
      - script.execute:
          id: queue_flag
          mask: 64
          val: false

number:
  - platform: template
    id: num_temp
    name: "Бризер температура"
    min_value: 5
    max_value: 25
    step: 1
    mode: box
    unit_of_measurement: "°C"
    optimistic: false
    set_action:
      - script.execute:
          id: queue_temp
          t: !lambda 'return (int) x;'

  - platform: template
    id: num_speed
    name: "Бризер скорость"
    min_value: 1
    max_value: 5
    step: 1
    mode: box
    optimistic: false
    set_action:
      - script.execute:
          id: queue_speed
          s: !lambda 'return (int) x;'
